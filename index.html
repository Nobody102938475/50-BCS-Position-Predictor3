<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>৫০তম বিসিএস ক্যাডার ও নন-ক্যাডার সম্ভাব্যতা বিশ্লেষণ</title>
    <style>
        body {
            font-family: 'SolaimanLipi', Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #006642;
            margin-bottom: 25px;
        }
        .warning-banner {
            background-color: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #ffeeba;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }
        select, input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .choice-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .choice-row select {
            flex-grow: 1;
        }
        .btn {
            background-color: #006642;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #004d31;
        }
        .btn-secondary {
            background-color: #4a5568;
            font-size: 14px;
            padding: 8px 15px;
            width: auto;
            margin-bottom: 20px;
        }
        .btn-secondary:hover {
            background-color: #2d3748;
        }
        .btn-danger {
            background-color: #c53030;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background: #e9f5f0;
            border-left: 5px solid #006642;
            display: none;
        }
        .fail-box {
            background: #fde8e8;
            border-left: 5px solid #c53030;
        }
        .non-cadre-box {
            background: #fef3c7;
            border-left: 5px solid #d97706;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>৫০তম বিসিএস ফলাফল ও ক্যাডার সম্ভাব্যতা বিশ্লেষণ</h2>
    
    <div class="warning-banner">
        ⚠️ এটি জাস্ট অনুমানমাত্র, বাস্তবিক নাও হতে পারে।
    </div>
    
    <form id="bcsForm">
        <div class="form-group">
            <label for="candidateType">প্রার্থীর ধরন:</label>
            <select id="candidateType" required onchange="toggleSubject()">
                <option value="">নির্বাচন করুন</option>
                <option value="General">General (সাধারণ)</option>
                <option value="Both">Both (সাধারণ + টেকনিক্যাল)</option>
                <option value="Technical">Only Technical (শুধু টেকনিক্যাল)</option>
            </select>
        </div>

        <div class="form-group" id="subjectGroup" style="display: none;">
            <label for="techSubject">টেকনিক্যাল সাবজেক্ট:</label>
            <input type="text" id="techSubject" placeholder="যেমন: এমবিবিএস, কৃষি বিজ্ঞান, ইঞ্জিনিয়ারিং ইত্যাদি">
        </div>

        <div class="form-group">
            <label for="writtenMark">লিখিত পরীক্ষার নম্বর (সর্বোচ্চ ৬০০):</label>
            <input type="number" id="writtenMark" min="450" max="600" step="0.5" placeholder="যেমন: ৪৭৫" required>
        </div>

        <div class="form-group">
            <label for="vivaMark">ভাইভা পরীক্ষার নম্বর (সর্বোচ্চ ৭৫):</label>
            <input type="number" id="vivaMark" min="0" max="75" step="0.5" placeholder="যেমন: ৫২" required>
        </div>

        <div class="form-group">
            <label>পছন্দক্রম (সর্বোচ্চ ২০টি ক্যাডার):</label>
            <div id="choicesContainer">
                <!-- Dynamically generated choice rows -->
            </div>
            <button type="button" class="btn btn-secondary" id="addChoiceBtn" onclick="addChoiceRow()">+ আরেকটি পছন্দ যোগ করুন</button>
        </div>

        <button type="button" class="btn" onclick="calculateResult()">বিশ্লেষণ করুন</button>
    </form>

    <div id="resultBox" class="result-box">
        <h3 id="resultTitle">ফলাফল</h3>
        <p id="resultDetails"></p>
        <div id="nonCadreNotice" class="non-cadre-box" style="display: none;">
            ⚠️ সতর্কবার্তা: আপনার মোট নম্বর ৫৫০ এর কম হওয়ায় ক্যাডার পাওয়ার সম্ভাবনা কম, তবে আপনার **নন-ক্যাডার** পদ আসার জোরালো সম্ভাবনা রয়েছে।
        </div>
    </div>
</div>

<script>
    // Exact 26 Cadres and their official seat allocations for 50th BCS
    const cadreSeats = {
        "বিসিএস (প্রশাসন)": 200,
        "বিসিএস (স্বাস্থ্য)": 650,
        "বিসিএস (পুলিশ)": 50,
        "বিসিএস (কৃষি)": 120,
        "বিসিএস (সাধারণ শিক্ষা - কলেজ)": 60,
        "বিসিএস (সাধারণ শিক্ষা - মাদ্রাসা-ই-আলিয়া)": 26,
        "বিসিএস (কারিগরি শিক্ষা - পলিটেকনিক্যাল)": 21,
        "বিসিএস (পররাষ্ট্র)": 15,
        "বিসিএস (কর)": 57,
        "বিসিএস (শুল্ক ও আবগারি)": 40,
        "বিসিএস (অডিট ও একাউন্টস)": 4,
        "বিসিএস (সমবায়)": 9,
        "বিসিএস (তথ্য)": 14,
        "বিসিএস (ডাক)": 8,
        "বিসিএস (বাণিজ্য)": 8,
        "বিসিএস (পরিবার পরিকল্পনা)": 36,
        "বিসিএস (খাদ্য)": 5,
        "বিসিএস (রেলওয়ে পরিবহন ও বাণিজ্যিক)": 1,
        "বিসিএস (আনসার)": 13,
        "বিসিএস (পশুপালন)": 20,
        "বিসিএস (মৎস্য)": 22,
        "বিসিএস (বন)": 15,
        "বিসিএস (জনগণপূর্ত - প্রকৌশলী)": 39,
        "বিসিএস (রেলওয়ে প্রকৌশলী)": 5,
        "বিসিএস (সড়ক ও জনপথ প্রকৌশলী)": 25,
        "বিসিএস (টেলিযোগাযোগ)": 0
    };

    const allCadres = Object.keys(cadreSeats);

    let choiceCount = 0;
    const maxChoices = 20;

    window.onload = function() {
        // Add initial 3 choices by default
        for(let i=0; i<3; i++) {
            addChoiceRow();
        }
    }

    function addChoiceRow() {
        if (choiceCount >= maxChoices) {
            alert("সর্বোচ্চ ২০টি পছন্দক্রম যুক্ত করা যাবে।");
            return;
        }
        choiceCount++;
        const container = document.getElementById('choicesContainer');
        const rowId = 'choiceRow_' + choiceCount;
        
        const div = document.createElement('div');
        div.className = 'choice-row';
        div.id = rowId;
        
        let selectHtml = `<select class="cadre-select" onchange="updateDropdowns()">
                            <option value="">-- পছন্দ ${choiceCount} নির্বাচন করুন --</option>`;
        allCadres.forEach(cadre => {
            selectHtml += `<option value="${cadre}">${cadre} (${cadreSeats[cadre]} পদ)</option>`;
        });
        selectHtml += `</select>`;
        
        if(choiceCount > 1) {
            selectHtml += `<button type="button" class="btn-danger" onclick="removeChoiceRow('${rowId}')">✕</button>`;
        }
        
        div.innerHTML = selectHtml;
        container.appendChild(div);
        updateDropdowns();
    }

    function removeChoiceRow(rowId) {
        document.getElementById(rowId).remove();
        choiceCount--;
        updateDropdowns();
    }

    // Prevent selecting duplicate cadres across dropdowns
    function updateDropdowns() {
        const selects = document.querySelectorAll('.cadre-select');
        let selectedValues = [];
        selects.forEach(s => {
            if(s.value) selectedValues.push(s.value);
        });

        selects.forEach(s => {
            const currentValue = s.value;
            for(let opt of s.options) {
                if(opt.value && selectedValues.includes(opt.value) && opt.value !== currentValue) {
                    opt.disabled = true;
                } else {
                    opt.disabled = false;
                }
            }
        });

        if(selects.length >= maxChoices) {
            document.getElementById('addChoiceBtn').style.display = 'none';
        } else {
            document.getElementById('addChoiceBtn').style.display = 'block';
        }
    }

    function toggleSubject() {
        const type = document.getElementById('candidateType').value;
        const subGroup = document.getElementById('subjectGroup');
        if (type === 'Both' || type === 'Technical') {
            subGroup.style.display = 'block';
        } else {
            subGroup.style.display = 'none';
        }
    }

    function calculateResult() {
        const written = parseFloat(document.getElementById('writtenMark').value);
        const viva = parseFloat(document.getElementById('vivaMark').value);
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultDetails = document.getElementById('resultDetails');
        const nonCadreNotice = document.getElementById('nonCadreNotice');

        if (isNaN(written) || isNaN(viva)) {
            alert("দয়া করে সঠিক নম্বর ইনপুট দিন।");
            return;
        }

        resultBox.style.display = 'block';

        // Check Viva Fail condition (< 50)
        if (viva < 50) {
            resultBox.className = "result-box fail-box";
            resultTitle.innerHTML = "❌ আপনি ভাইভায় অকৃতকার্য (Fail) হয়েছেন";
            resultDetails.innerHTML = `আপনার ভাইভার নম্বর ৫০ এর কম (${viva}) হওয়ায় বিসিএস নিয়মানুযায়ী আপনি এই ধাপে উত্তীর্ণ হতে পারেননি।`;
            nonCadreNotice.style.display = 'none';
            return;
        }

        resultBox.className = "result-box";
        const total = written + viva;

        // Rank Calculation based strictly on user rules:
        // >= 620: 1st 50
        // 600-620: next 300 (51 - 350)
        // 590-600: next 100 (351 - 450)
        // 580-590: next 150 (451 - 600)
        // 570-580: next 200 (601 - 800)
        // < 570: scaled beyond 800 up to 6000
        let estimatedRank = 1000;
        if (total >= 620) {
            estimatedRank = Math.floor(Math.random() * 20) + 1;
        } else if (total >= 600) {
            estimatedRank = 20 + Math.floor(((620 - total) / 20) * 150);
        } else if (total >= 590) {
            estimatedRank = 170 + Math.floor(((600 - total) / 10) * 130);
        } else if (total >= 580) {
            estimatedRank = 300 + Math.floor(((590 - total) / 10) * 200);
        } else if (total >= 570) {
            estimatedRank = 500 + Math.floor(((580 - total) / 10) * 200);
        } else {
            estimatedRank = 700 + Math.floor(((570 - total) / 70) * 5300);
        }
        if (estimatedRank > 6000) estimatedRank = 6000;

        // Get user choices
        let selectedChoices = [];
        document.querySelectorAll('.cadre-select').forEach(s => {
            if(s.value) selectedChoices.push(s.value);
        });

        let recommendedCadre = "কোনো ক্যাডার নির্ধারিত হয়নি";
        if (selectedChoices.length > 0) {
            let cumulativeSeats = 0;
            for (let cadre of selectedChoices) {
                let seats = cadreSeats[cadre] || 50; 
                cumulativeSeats += seats;
                if (estimatedRank <= cumulativeSeats) {
                    recommendedCadre = cadre;
                    break;
                }
            }
            if (estimatedRank > cumulativeSeats) {
                recommendedCadre = "আপনার মেধাক্রম অনুযায়ী আপনার দেওয়া পছন্দক্রমের মধ্যে কোনো ক্যাডার আসার সম্ভাবনা কম (নন-ক্যাডার লক্ষ্য করুন)।";
            }
        } else {
            recommendedCadre = "কমপক্ষে একটি পছন্দক্রম নির্বাচন করুন।";
        }

        resultTitle.innerHTML = "📊 আপনার সম্ভাব্য ফলাফল ও ক্যাডার বিশ্লেষণ";
        resultDetails.innerHTML = `
            <b>মোট নম্বর:</b> ${total.toFixed(1)} (লিখিত: ${written} + ভাইভা: ${viva})<br>
            <b>আনুমানিক মেধাক্রম (Rank):</b> প্রায় ${estimatedRank} তম<br>
            <b>আপনার জন্য সম্ভাব্য ক্যাডার:</b> <span style="color: #006642; font-size: 18px;">${recommendedCadre}</span>
        `;

        // Non-cadre notice if total < 550
        if (total < 550) {
            nonCadreNotice.style.display = 'block';
        } else {
            nonCadreNotice.style.display = 'none';
        }
    }
</script>

</body>
</html>
